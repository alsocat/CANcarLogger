<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service history</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f2f0; color: #1a1a1a; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .toolbar { display: flex; gap: 8px; justify-content: flex-end; max-width: 8.5in; margin: 16px auto 0; padding: 0 16px; }
  .toolbar a, .toolbar button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px; cursor: pointer; text-decoration: none; }
  .toolbar button { background: #2a78d6; color: #fff; border: 0; }
  .toolbar a { color: #444; border: 1px solid #ccc; background: #fff; }
  .page { background: #fff; max-width: 8.5in; margin: 12px auto 32px; padding: 0.6in 0.6in; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid #1a1a1a; padding-bottom: 12px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: #555; font-size: 13px; }
  .facts { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 24px; margin-bottom: 20px; font-size: 13px; }
  .facts span { color: #666; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .facts b { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #555; border-bottom: 1px solid #1a1a1a; padding: 6px 8px 6px 0; }
  td { border-bottom: 1px solid #ddd; padding: 7px 8px 7px 0; vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.date { white-space: nowrap; }
  td.note { color: #444; }
  tfoot td { border-bottom: 0; font-weight: 600; padding-top: 10px; }
  .empty { text-align: center; color: #777; padding: 32px 0; }
  footer { margin-top: 24px; color: #888; font-size: 11px; }
  @media (max-width: 640px) {
    .page { padding: 20px 16px; margin: 12px 0 24px; }
    .facts { grid-template-columns: repeat(2, auto); }
    .table-wrap { overflow-x: auto; }
  }
  @media print {
    @page { margin: 0.5in; }
    body { background: #fff; }
    .toolbar { display: none; }
    .page { box-shadow: none; margin: 0; padding: 0; max-width: none; }
    tr { break-inside: avoid; }
    thead { display: table-header-group; }
  }
</style>
</head>
<body>
<div class="toolbar"><a href="/">← Dashboard</a><button onclick="window.print()">Print</button></div>
<main class="page">
  <header>
    <div><h1 id="car">Service history</h1><div class="sub" id="vin"></div></div>
    <div class="sub">Service record</div>
  </header>
  <div class="facts">
    <div><span>Current odometer</span><b id="odo">—</b></div>
    <div><span>Services logged</span><b id="count">—</b></div>
    <div><span>Total cost</span><b id="total">—</b></div>
    <div><span>Printed</span><b id="printed"></b></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date</th><th class="num">Odometer</th><th>Service</th><th class="num">Cost</th><th>Notes</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
  <footer>Odometer readings are in miles. Generated by carlog.</footer>
</main>
<script src="/static/car.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const day = ts => new Date(ts * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const money = v => "$" + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mi = v => v ? Math.round(v).toLocaleString() : "—";

(async () => {
  const [summary, rows] = await Promise.all([
    fetch("/api/summary").then(r => r.json()),
    fetch("/api/maintenance").then(r => r.json()),
  ]);
  const s = summary.settings;
  $("car").textContent = s.car_name;
  document.title = `${s.car_name} service history`;
  $("vin").textContent = s.vin ? `VIN ${s.vin}` : "";
  $("odo").textContent = summary.odometer_mi ? `${mi(summary.odometer_mi)} mi` : "—";
  $("printed").textContent = day(Date.now() / 1000);
  $("count").textContent = rows.length;
  const total = rows.reduce((a, m) => a + (m.cost || 0), 0);
  $("total").textContent = total ? money(total) : "—";
  if (!rows.length) {
    $("rows").innerHTML = '<tr><td colspan="5" class="empty">No maintenance logged.</td></tr>';
    return;
  }
  $("rows").innerHTML = rows.map(m => `<tr>
    <td class="date">${day(m.ts)}</td><td class="num">${mi(m.odometer_mi)}</td>
    <td>${esc(m.kind)}</td><td class="num">${m.cost != null ? money(m.cost) : "—"}</td>
    <td class="note">${esc(m.note)}</td></tr>`).join("");
  if (total) $("foot").innerHTML = `<tr><td colspan="3">Total</td><td class="num">${money(total)}</td><td></td></tr>`;
})();
</script>
</body>
</html>
